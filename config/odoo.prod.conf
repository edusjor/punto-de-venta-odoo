; Configuración de Odoo 19 para PRODUCCIÓN (VPS), detrás de Caddy (HTTPS).
; Sin credenciales: db_user, db_password y admin_passwd se añaden al arrancar
; desde .env en /tmp/odoo.conf dentro del contenedor (ver docker-compose.yml).
; Se monta en lugar de odoo.conf mediante docker-compose.prod.yml.

[options]
; --- Base de datos ---
db_host = db
db_port = 5432
db_maxconn = 64
; Única base de producción (ODOO_DB en .env)
dbfilter = ^odoo_pos$
; Sin gestor de bases por web
list_db = False

; --- Rutas ---
data_dir = /var/lib/odoo
addons_path = /mnt/extra-addons/custom,/usr/lib/python3/dist-packages/odoo/addons

; --- HTTP (solo accesible por Caddy en la red interna) ---
http_port = 8069
http_interface = 0.0.0.0
; Websocket del PdV (mesas en tiempo real, cocina) con workers > 0
gevent_port = 8072
; Detrás de proxy: respeta X-Forwarded-* (HTTPS, IP real del cliente)
proxy_mode = True

; --- Procesos ---
; Regla: workers = (CPUs * 2) + 1, limitado por RAM (~150-250 MB cada uno).
; 2 workers + 1 cron es adecuado para un VPS de 1-2 vCPU / 4 GB.
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
; 640 MB / 768 MB por worker: con 2 workers + gevent + cron no se llenan los 4 GB
limit_memory_soft = 671088640
limit_memory_hard = 805306368

; --- Registro (se rota con el driver json-file de Docker) ---
log_level = info
log_handler = :INFO
logfile =
without_demo = True
