; Configuración de Odoo 19 (desarrollo local).
; Este archivo NO contiene credenciales: db_user, db_password y admin_passwd
; se añaden al arrancar desde .env en /tmp/odoo.conf dentro del contenedor
; (ver entrypoint en docker-compose.yml).

[options]
; --- Base de datos (host = nombre del servicio en la red interna) ---
db_host = db
db_port = 5432
db_maxconn = 64
; Solo bases cuyo nombre empiece por odoo_
dbfilter = ^odoo_.*$
; Sin gestor de bases por web (ni enlace en el login). Crear bases: scripts/create-db.ps1
list_db = False

; --- Rutas ---
data_dir = /var/lib/odoo
addons_path = /mnt/extra-addons/custom,/usr/lib/python3/dist-packages/odoo/addons

; --- HTTP ---
http_port = 8069
; Dentro del contenedor; el host solo publica en 127.0.0.1
http_interface = 0.0.0.0
proxy_mode = False

; --- Procesos ---
; 0 = modo multihilo (adecuado en desarrollo; el POS usa websocket en el mismo puerto).
; En el VPS se usarán workers > 0 con gevent_port 8072 detrás de un proxy.
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; --- Registro ---
log_level = info
log_handler = :INFO
logfile =
; Sin demo por defecto al crear bases (se puede marcar en el asistente)
without_demo = True
